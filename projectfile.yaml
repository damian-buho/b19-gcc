---
# SPDX-FileCopyrightText: 2026 Damián Búho <damian.buho@proton.me>
#
# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: gcc
  summary: GCC compiler toolchain from Ubuntu apt with sccache/ccache
  title: B19/GCC
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/vulnerabilities/linux-libc-dev.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
links:
  - label: B19/GCC on Codeberg
    type: source-code
    url: https://codeberg.org/b19/gcc
  - label: B19/GCC on GitHub
    type: source-code
    url: https://github.com/damian-buho/b19-gcc
  - label: B19/GCC on kiota.ch
    type: source-code
    url: https://kiota.ch/b19/gcc
  - label: Issues on Codeberg
    type: bugs
    url: https://codeberg.org/b19/gcc/issues
  - label: Issues on GitHub
    type: bugs
    url: https://github.com/damian-buho/b19-gcc/issues
org:
  b19:
    scaffold:
      compile-stage: compile-gcc
      root-stage: base
  projectfile:
    # The compile-cache entries are shell shims named for the compiler they
    # shadow on PATH, so an extension would defeat their whole purpose. The
    # fleet conventions in m6e traits/shell.yaml cannot reach a shape this
    # project invented; naming it here keeps them lintable and cache-visible.
    attributes:
      shell:
        include:
          - "**/compile-cache/*/*"
    ci:
      image: b19/gcc-{B19_GCC_SERIES}
      matrix:
        axes:
          B19_GCC_SERIES:
            - 16
            - 15
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/b19/gcc.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-gcc.git
  - role: origin
    type: git
    url: ssh://git@kiota.ch/b19/gcc.git
