$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: gcc
  summary:
    en: Community-maintained distribution of GCC based on B19/Ubuntu
    es: Distribución de GCC mantenida por la comunidad, basada en B19/Ubuntu
    uk: Дистрибуція GCC з підтримкою спільноти на основі B19/Ubuntu
  title: B19 / GCC
  description:
    en: GCC toolchain with sccache, the mold linker and per-arch tuned flags, plus gdb, cmake, ninja and valgrind.
    es: Cadena GCC con sccache, enlazador mold y flags por arquitectura, más gdb, cmake, ninja y valgrind.
    uk: Інструментарій GCC із sccache, лінкером mold і прапорами під архітектуру, плюс gdb, cmake, ninja та valgrind.
  version: 0.8.12
  released: "2026-10-19"
  visibility: public
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/traits/image/release.yaml
  - .makefile/b19/vulnerabilities/deb/linux-libc-dev.yaml
  - .makefile/container/traits/image/variant.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/forge/github.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/registry/dockerhub.yaml
keywords:
  - gcc
  - compiler
  - toolchain
  - cmake
  - sccache
  - build-essential
kind: SoftwareSourceCode
links:
  - label:
      en: Repository on GitHub
      es: Repositorio en GitHub
      uk: Репозиторій на GitHub
    priority: 80
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/b19-gcc
  - label:
      en: Issues on GitHub
      es: Incidencias en GitHub
      uk: Задачі на GitHub
    priority: 80
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/b19-gcc/issues
  - label:
      en: Repository on kiota.ch
      es: Repositorio en kiota.ch
      uk: Репозиторій на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/b19/gcc
  - label:
      en: Packages on GHCR
      es: Paquetes en GHCR
      uk: Пакунки на GHCR
    type: package-registry
    url: https://github.com/damian-buho/b19-gcc/pkgs/container/b19%2Fgcc
  - label:
      en: Packages on Docker Hub
      es: Paquetes en Docker Hub
      uk: Пакунки на Docker Hub
    type: package-registry
    url: https://hub.docker.com/r/damianbuho/b19-gcc
org:
  b19:
    scaffold:
      compile-stage: compile-gcc
      root-stage: base
  projectfile:
    architecture:
      - amd64
      - arm64
      - riscv64
    attributes:
      shell:
        include:
          - '**/compile-cache/*/*'
    build:
      args:
        B19_GCC_SERIES: "16"
    image:
      series: "gcc{B19_GCC_SERIES}"
      tag: ${series}
      variant:
        parts:
          - series
    ci:
      matrix:
        axes:
          B19_GCC_SERIES:
            - 16
            - 15
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-gcc.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/b19/gcc.git
technologies:
  - c
  - cpp
