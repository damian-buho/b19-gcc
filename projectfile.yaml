$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: gcc
  summary: Community-maintained distribution of GCC based on B19/Ubuntu
  title: B19/GCC
  description: Community-maintained distribution of GCC built on B19/Ubuntu. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream GCC is fetched at build time and retains its own licensing.
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/vulnerabilities/linux-libc-dev.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
links:
  - label:
      en: B19/GCC on Codeberg
      es: B19/GCC en Codeberg
      uk: B19/GCC на Codeberg
    tags:
      - public
      - badges
      - badges-gitea
    type: source-code
    url: https://codeberg.org/b19/gcc
  - label:
      en: B19/GCC on GitHub
      es: B19/GCC en GitHub
      uk: B19/GCC на GitHub
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/b19-gcc
  - label:
      en: B19/GCC on kiota.ch
      es: B19/GCC en kiota.ch
      uk: B19/GCC на kiota.ch
    preferred: true
    type: source-code
    url: https://kiota.ch/b19/gcc
  - label:
      en: Issues on Codeberg
      es: Incidencias en Codeberg
      uk: Issues на Codeberg
    tags:
      - support
    type: bugs
    url: https://codeberg.org/b19/gcc/issues
  - label:
      en: Issues on GitHub
      es: Incidencias en GitHub
      uk: Issues на GitHub
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/b19-gcc/issues
org:
  b19:
    scaffold:
      compile-stage: compile-gcc
      root-stage: base
  projectfile:
    attributes:
      shell:
        include:
          - '**/compile-cache/*/*'
    image:
      series: "{B19_GCC_SERIES}"
      path: ${org}/${name}-${series}
      flatpath: ${org}-${name}-${series}
    ci:
      image: b19/gcc-{B19_GCC_SERIES}
      matrix:
        axes:
          B19_GCC_SERIES:
            - 16
            - 15
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/b19/gcc.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-gcc.git
  - role: origin
    type: git
    url: ssh://git@kiota.ch/b19/gcc.git
keywords:
  - gcc
  - compiler
  - toolchain
  - c
  - cpp
  - docker
technologies:
  - c
  - cpp
