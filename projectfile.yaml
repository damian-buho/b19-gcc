$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: gcc
  summary:
    en: Community-maintained distribution of GCC based on B19/Ubuntu
    es: Distribución de GCC mantenida por la comunidad, basada en B19/Ubuntu
    uk: Дистрибуція GCC з підтримкою спільноти на основі B19/Ubuntu
  title: B19 / GCC
  description:
    en: Community-maintained distribution of GCC built on B19/Ubuntu. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream GCC is fetched at build time and retains its own licensing.
    es: Distribución de GCC mantenida por la comunidad, construida sobre B19/Ubuntu. Este repositorio contiene únicamente el empaquetado — Dockerfile, scripts de compilación y configuración, todo con licencia MIT; el código original de GCC se obtiene en tiempo de compilación y conserva su propia licencia.
    uk: Дистрибуція GCC з підтримкою спільноти, зібрана на основі B19/Ubuntu. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; вихідний код GCC отримують під час збирання, і він зберігає власну ліцензію.
  version: 1.1.6
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/vulnerabilities/linux-libc-dev.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
keywords:
  - gcc
  - compiler
  - toolchain
  - c
  - cpp
  - docker
kind: SoftwareSourceCode
org:
  b19:
    scaffold:
      compile-stage: compile-gcc
      root-stage: base
  projectfile:
    attributes:
      shell:
        include:
          - '**/compile-cache/*/*'
    image:
      series: "{B19_GCC_SERIES}"
      path: ${org}/${name}-${series}
      flatpath: ${org}-${name}-${series}
    ci:
      image: b19/gcc-{B19_GCC_SERIES}
      matrix:
        axes:
          B19_GCC_SERIES:
            - 16
            - 15
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
technologies:
  - c
  - cpp
links:
  - label:
      en: B19 / GCC on kiota.ch
      es: B19 / GCC en kiota.ch
      uk: B19 / GCC на kiota.ch
    preferred: true
    type: source-code
    url: https://kiota.ch/b19/gcc
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/b19/gcc.git
